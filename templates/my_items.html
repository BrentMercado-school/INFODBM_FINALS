<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>ShareNest</h2>
        </div>

        <nav class="sidebar-nav">
            <a href="/api/home" class="nav-link">
                <i data-lucide="home"></i>
                <span>Home</span>
            </a>
            <a href="/api/myitems" class="nav-link active">
                <i data-lucide="package"></i>
                <span>My Items</span>
            </a>
            <a href="/api/community_items" class="nav-link">
                <i data-lucide="users"></i>
                <span>Community Items</span>
            </a>
            <a href="/api/request" class="nav-link">
                <i data-lucide="inbox"></i>
                <span>Requests</span>
            </a>
            <a href="/profile" class="nav-link">
                <i data-lucide="user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="nav-link logout">
                <i data-lucide="log-out"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <input type="text" class="search-input" id="item_search" placeholder="Search my items...">
            <button class="btn-primary" onclick="searchItems()">
                <i data-lucide="search"></i> Search
            </button>
            <button class="btn-secondary" onclick="clearSearch()">Clear</button>
        </div>

        <div class="filter-chips">
            <button class="chip active" data-filter="all" onclick="setFilter('all')">All</button>
            <button class="chip" data-filter="available" onclick="setFilter('available')">Available</button>
            <button class="chip" data-filter="borrowed" onclick="setFilter('borrowed')">Borrowed</button>
            <button class="chip" data-filter="latest" onclick="setFilter('latest')">Latest</button>
        </div>

        <select id="item_filter" style="display:none">
            <option value="all">All</option>
            <option value="available">Available</option>
            <option value="borrowed">Borrowed</option>
            <option value="latest">Latest</option>
        </select>

        <p id="general_message" class="message"></p>

        <section class="section">
            <h1 class="section-title">My Items</h1>
            <div class="items-grid" id="my_items_grid"></div>
            <p id="table_message" class="message"></p>
        </section>

    </main>
</div>


<div class="modal-overlay" id="edit_item_modal" style="display:none">
    <div class="modal-card">
        <h2>Edit Item</h2>

        <label>Item Name</label>
        <input type="text" id="edit_item_name" placeholder="Enter item name">

        <label>Category</label>
        <select id="edit_category">
            <option value="">Select a category</option>
        </select>

        <label>Condition</label>
        <input type="text" id="edit_condition" placeholder="Enter item condition">

        <label>Description</label>
        <input type="text" id="edit_description" placeholder="Enter item description">

        <label>Note</label>
        <input type="text" id="edit_note" placeholder="Note to borrower">

        <label>Security Deposit</label>
        <input type="number" id="edit_security_deposit" min="0" step="0.01" placeholder="Enter security deposit">

        <label>Replace image (optional)</label>
        <input type="file" id="edit_image" accept="image/*">

        <p id="edit_item_message" class="message"></p>

        <div class="modal-buttons">
            <button class="btn-primary" onclick="updateItem()">Save Changes</button>
            <button class="btn-secondary" onclick="cancelEdit()">Cancel</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="return_modal" style="display:none">
    <div class="modal-card return-card">

        <h3 class="return-heading">Borrower Details</h3>
        <div class="return-panel">
            <div class="return-borrower-top">
                <img id="borrower_image" class="return-avatar" alt="Borrower">
                <div>
                    <p class="return-borrower-name" id="borrower_name"></p>
                </div>
            </div>
            <div class="return-address">
                <i data-lucide="map-pin"></i>
                <span id="borrower_address"></span>
            </div>
        </div>

        <h3 class="return-heading">Item Details</h3>
        <div class="return-panel return-item-panel">
            <img id="return_item_image" class="return-item-img" alt="Item">
            <div class="return-item-info">
                <h4 id="return_item_name" class="return-item-name"></h4>
                <span class="return-category-pill">
                    <i data-lucide="check-circle"></i>
                    <span id="return_item_category"></span>
                </span>
                <p class="return-item-meta">Condition: <span id="return_item_condition"></span></p>
                <p class="return-item-meta">Security Deposit: ₱<span id="return_item_deposit_text"></span></p>
            </div>
        </div>

        <div class="return-grid">
            <div>
                <label>Start Date</label>
                <input type="text" id="return_start_date" readonly>
            </div>
            <div>
                <label>Expected Return Date</label>
                <input type="text" id="return_expected_date" readonly>
            </div>
            <div>
                <label>Borrowing Fee</label>
                <input type="text" id="return_borrowing_fee" readonly value="₱5">
            </div>
            <div>
                <label>Security Deposit</label>
                <input type="text" id="return_security_deposit" readonly>
            </div>
        </div>

        <div class="return-grid">
            <div>
                <label>Actual Return Date</label>
                <input type="date" id="return_actual_date">
            </div>
            <div>
                <label>Damage Fee</label>
                <input type="number" id="return_damage_fee" min="0" step="0.01" placeholder="Enter amount">
            </div>
        </div>

        <p id="return_modal_message" class="message"></p>

        <div class="modal-buttons" id="return_step1_buttons">
            <button class="btn-primary" onclick="showReturnReceipt()">Confirm Return</button>
            <button class="btn-secondary" onclick="closeReturnModal()">Cancel</button>
        </div>

        <div id="return_receipt" style="display:none">
            <div class="return-total">
                <div class="return-total-header">
                    <span>Return Summary</span>
                    <span>Amount</span>
                </div>
                <div class="return-total-row">
                    <span>Security Deposit</span>
                    <span id="receipt_deposit">₱0</span>
                </div>
                <div class="return-total-row">
                    <span>Damage Fee</span>
                    <span class="deduct" id="receipt_damage">-₱0</span>
                </div>
                <div class="return-total-row">
                    <span id="receipt_penalty_label">Late Penalty</span>
                    <span class="deduct" id="receipt_penalty">-₱0</span>
                </div>
                <div class="return-total-final">
                    <span id="receipt_final_label">Amount to return</span>
                    <span id="receipt_final">₱0</span>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn-primary" onclick="submitReturn()">Confirm Return</button>
                <button class="btn-secondary" onclick="cancelReceipt()">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
<script src="/static/my_items.js"></script>
</body>
</html>
