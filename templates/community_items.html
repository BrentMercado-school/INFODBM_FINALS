<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Items</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>ShareNest</h2>
        </div>

        <nav class="sidebar-nav">
            <a href="/api/home" class="nav-link">
                <i data-lucide="home"></i>
                <span>Home</span>
            </a>
            <a href="/api/myitems" class="nav-link">
                <i data-lucide="package"></i>
                <span>My Items</span>
            </a>
            <a href="/api/community_items" class="nav-link active">
                <i data-lucide="users"></i>
                <span>Community Items</span>
            </a>
            <a href="/api/request" class="nav-link">
                <i data-lucide="inbox"></i>
                <span>Requests</span>
            </a>
            <a href="/profile" class="nav-link">
                <i data-lucide="user"></i>
                <span>Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#" onclick="logout()" class="nav-link logout">
                <i data-lucide="log-out"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- Top bar: search -->
        <div class="topbar">
            <input type="search" class="search-input" placeholder="Search items..." id="search_item">
            <button class="btn-primary" onclick="loadSearchCommunityItems()">
                <i data-lucide="search"></i> Search
            </button>
        </div>

        <!-- Category filter chips -->
        <div class="filter-chips">
            <button class="chip active" onclick="loadAllCommunityItems()">All Items</button>
            <button class="chip" onclick="loadApplianceCommunityItems()">Appliance</button>
            <button class="chip" onclick="loadTechnologyCommunityItems()">Technology</button>
            <button class="chip" onclick="loadSportsCommunityItems()">Sports</button>
        </div>

        <!-- Items grid -->
        <section class="section">
            <p id="filtered_by" class="filter-label">Filtered by: All</p>
            <h1 class="section-title">Community Items</h1>
            <div class="items-grid" id="community_items_grid"></div>
            <p id="table_message" class="message"></p>
        </section>

    </main>
</div>

<!-- View Item modal -->
<div class="modal-overlay" id="view_item_modal" style="display:none">
    <div class="modal-card">
        <h2>Item Details</h2>
        <input type="hidden" id="item_id">
        <img id="item_image_borrow" alt="No image" style="width:100%;height:160px;object-fit:cover;border-radius:10px;">

        <label>Item Name</label>
        <input type="text" id="item_name_borrow" readonly>
        <label>Item Category</label>
        <input type="text" id="item_name_category" readonly>
        <label>Item Condition</label>
        <input type="text" id="item_name_condition" readonly>
        <label>Owner</label>
        <input type="text" id="item_owner" readonly>
        <label>Note</label>
        <input type="text" id="item_note_borrow" readonly>
        <label>Security Deposit</label>
        <input type="text" id="item_security_deposit" readonly>
        <label>Status</label>
        <input type="text" id="item_security_status" readonly>

        <div id="view_details_buttons" class="modal-buttons">
            <button class="btn-primary" onclick="openBorrowDetailsModal()">Borrow</button>
            <button class="btn-secondary" onclick="closeViewItemDetailsModal()">Close</button>
        </div>

        <div id="borrow_details_modal" style="display:none">
            <h2>Borrow Details</h2>
            <label>Start Date</label>
            <input type="date" id="start_date">
            <label>Return Date</label>
            <input type="date" id="return_date">
            <div class="modal-buttons">
                <button class="btn-primary" onclick="borrowItem()">Confirm Borrow</button>
                <button class="btn-secondary" onclick="cancelBorrow()">Cancel</button>
            </div>
        </div>

        <p id="borrow_message" class="message"></p>
    </div>
</div>

<!-- Lucide icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>lucide.createIcons();</script>
<script src="/static/community_items.js"></script>
</body>
</html>
